<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Standalone browser (no Telegram identity, not the website embed): mark it
  // before anything renders, so no account card shows while the SYLVEX
  // session is still being checked (see setBrowserGuest in cabinet.js).
  (function () {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      var embed = new URLSearchParams(window.location.search || '').get('embed') === 'web';
      if (!(tg && tg.initData) && !embed) {
        document.documentElement.classList.add('browser-app', 'browser-auth-pending');
        // What local storage held before the app wrote anything this load.
        window.__sylvexStartKeys = Object.keys(window.localStorage || {});
      }
    } catch (e) {}
  })();
</script>
</head>

<script>
  // Load the cabinet markup, then boot the app.
  fetch('cabinet.html?v=ref-panel-20261027')
    .then(r => {
      if (!r.ok) throw new Error('Failed to load cabinet.html: ' + r.status);
      return r.text();
    })
    .then(html => {
      document.getElementById('app-root').innerHTML = html;
      if (!window.SYLVEX || typeof window.SYLVEX.init !== 'function') {
        throw new Error('SYLVEX.init() is not available');
      }
      window.SYLVEX.init();
    })
    .catch(error => {
      console.error(error);
      document.getElementById('app-root').innerHTML = '<div style="padding:24px;color:#fff;font-family:system-ui">Failed to load SYLVEX. Please reopen the app.</div>';
    });
</script>
